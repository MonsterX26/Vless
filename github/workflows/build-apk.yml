name: Build CipherLink APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Resolve Android and sing-box dependencies
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'libbox.so'
          mkdir -p out
          cp "$APK" out/cipherlink-personal.apk
          sha256sum out/cipherlink-personal.apk | tee out/SHA256SUMS.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cipherlink-personal-apk
          path: |
            out/cipherlink-personal.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
